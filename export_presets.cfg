architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=2000
version/name=""
; KEPT ON PURPOSE: the package id still carries the game's old name (Wizard Survivors, renamed The One
; He Missed on 2026-11-02). It is the app's identity on Android - a new id is a second app that cannot
; update the first, and every installed copy's save is filed under this one. package/name is only the
; label under the icon (The Last Wizard: Survivors since 2026-11-08). release.sh refuses an APK with any
; other id (.ai/releasing.md, "The rename").
package/unique_name="com.ecec.wizardsurvivors"
package/name="The Last Wizard: Survivors"
package/signed=true
package/show_in_android_tv=false
package/show_in_app_library=true
launcher_icons/main_192x192="res://assets/bonelight/ui/icons/android-icon-main.png"
launcher_icons/adaptive_foreground_432x432="res://assets/bonelight/ui/icons/android-icon-foreground.png"
launcher_icons/adaptive_background_432x432="res://assets/bonelight/ui/icons/android-icon-background.png"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=true
dotnet/embed_build_outputs=false

